<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haftanın Hutbesi | Ayetin Vakti</title>
    <meta name="theme-color" content="#10b981">
    
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const savedBg = localStorage.getItem('custom_bg');
        if (savedBg && savedTheme !== 'light') {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #047857;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9 !important;
            --card-bg: #ffffff !important;
            --accent-color: #059669 !important;
            --accent-hover: #047857 !important;
            --text-color: #0f172a !important;
            --text-muted: #64748b !important;
            --border-color: #cbd5e1 !important;
            --btn-bg: #f8fafc !important;
            --btn-hover: #e2e8f0 !important;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08) !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; transition: background-color 0.3s ease, color 0.3s ease; }
        
        .main-wrapper { width: 100%; max-width: 1050px; display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; transition: 0.3s ease; }
        
        /* Menü gizlendiğinde grid yapısını tek kolona düşürüp içerik kartını ortalıyoruz */
        .main-wrapper.sidebar-closed { grid-template-columns: 1fr; max-width: 750px; }
        .main-wrapper.sidebar-closed .sidebar-card { display: none; }

        @media(max-width: 850px) { 
            .main-wrapper { grid-template-columns: 1fr; }
            .main-wrapper.sidebar-closed .sidebar-card { display: none; }
        }

        .container { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        
        /* Sol Arşiv Paneli */
        .sidebar-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); position: sticky; top: 16px; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; background-color: var(--card-bg); z-index: 2; }
        .sidebar-title { font-size: 1rem; font-weight: 700; color: var(--accent-color); display: flex; align-items: center; gap: 6px; }
        
        .collapse-btn { background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .collapse-btn:hover { border-color: var(--accent-color); color: var(--accent-color); background: var(--btn-hover); }

        /* max-height yaklaşık 3 hutbe sığacak şekilde */
        .archive-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
        
        .archive-list::-webkit-scrollbar { width: 6px; }
        .archive-list::-webkit-scrollbar-track { background: transparent; }
        .archive-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .archive-list::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        .archive-item { text-align: left; background: var(--btn-bg); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--text-color); transition: 0.2s; display: flex; flex-direction: column; gap: 2px; }
        .archive-item:hover, .archive-item.active { border-color: var(--accent-color); background: var(--btn-hover); }
        .archive-date { font-size: 0.75rem; color: var(--accent-color); font-weight: 600; }
        .archive-name { font-size: 0.85rem; font-weight: 600; color: var(--text-color); }

        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: var(--shadow); transition: 0.3s; }
        [dir="rtl"] .navbar { flex-direction: row-reverse; }

        .circle-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; font-size: 1.2rem; transition: 0.2s; }
        .circle-btn:hover { border-color: var(--accent-color); color: var(--accent-color); background: var(--btn-hover); }
        
        .nav-left-group { display: flex; align-items: center; gap: 8px; }
        .toggle-sidebar-trigger { display: none; } /* Normalde ekranda gizli, menü kapalıyken sol üste açma butonu gelebilir veya navbar'dan yönetilir */
        
        .app-title { font-size: 1.1rem; font-weight: 700; color: var(--accent-color); text-align: center; }

        .content-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); transition: 0.3s; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .card-title { font-size: 1.15rem; font-weight: 700; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }
        
        .title-actions { display: flex; align-items: center; gap: 8px; }
        .show-archive-btn { background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--accent-color); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: none; transition: 0.2s; }
        .show-archive-btn:hover { background: var(--btn-hover); border-color: var(--accent-color); }

        .date-badge { font-size: 0.8rem; background: var(--btn-bg); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 20px; color: var(--text-muted); font-weight: 600; }

        .hutbe-meta { display: flex; flex-direction: column; gap: 6px; }
        .hutbe-main-title { font-size: 1.15rem; font-weight: 700; color: var(--text-color); line-height: 1.4; }
        
        .hutbe-body { font-size: 0.92rem; color: var(--text-muted); line-height: 1.7; display: flex; flex-direction: column; gap: 12px; }
        .hutbe-body p { text-align: justify; }

        .quote-box { background: var(--btn-bg); border-left: 4px solid var(--accent-color); padding: 12px 16px; border-radius: 0 12px 12px 0; font-style: italic; color: var(--text-color); font-size: 0.9rem; }
        [dir="rtl"] .quote-box { border-left: none; border-right: 4px solid var(--accent-color); border-radius: 12px 0 0 12px; }

        .external-link-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--accent-color); color: #fff; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow); transition: 0.2s; margin-top: 6px; }
        .external-link-btn:hover { background: var(--accent-hover); }

        .footer { grid-column: 1 / -1; margin: 10px 0; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
        .footer span { color: var(--accent-color); font-weight: 600; }
    </style>
</head>
<body>

<div class="main-wrapper" id="main-wrapper">
    <!-- SOL ARŞİV MENÜSÜ -->
    <div class="sidebar-card" id="sidebar-card">
        <div class="sidebar-header">
            <div class="sidebar-title">📚 Hutbe Arşivi</div>
            <button class="collapse-btn" onclick="toggleSidebar()" title="Menüyü Gizle">✕</button>
        </div>
        <div class="archive-list" id="archive-list">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </div>

    <!-- SAĞ ANA İÇERİK ALANI -->
    <div class="container">
        <header class="navbar">
            <div class="nav-left-group">
                <a href="../" class="circle-btn" title="Ana Sayfaya Dön">←</a>
                <button class="circle-btn" onclick="toggleSidebar()" id="menu-open-btn" title="Arşivi Aç" style="display:none;">📚</button>
            </div>
            <div class="app-title">Haftanın Hutbesi</div>
            <button class="circle-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
        </header>

        <div class="content-card">
            <div class="card-header-flex">
                <div class="card-title">
                    📜 Cuma Hutbesi
                    <button class="show-archive-btn" id="show-archive-inline" onclick="toggleSidebar()">📚 Arşivi Göster</button>
                </div>
                <div class="date-badge" id="hutbe-date">Yükleniyor...</div>
            </div>

            <div class="hutbe-meta">
                <div class="hutbe-main-title" id="hutbe-title">Yükleniyor...</div>
            </div>

            <div class="hutbe-body" id="hutbe-content">
                <!-- İçerik Dinamik Yüklenecek -->
            </div>

            <a href="https://www.diyanet.gov.tr" target="_blank" id="hutbe-link" class="external-link-btn">
                🔗 Diyanet İşleri Başkanlığı Orijinal Kaynak
            </a>
        </div>
    </div>
</div>

            ],

    function toggleSidebar() {
        const wrapper = document.getElementById('main-wrapper');
        const openBtn = document.getElementById('menu-open-btn');
        const inlineBtn = document.getElementById('show-archive-inline');
        
        wrapper.classList.toggle('sidebar-closed');
        
        const isClosed = wrapper.classList.contains('sidebar-closed');
        if (isClosed) {
            if (openBtn) openBtn.style.display = 'flex';
            if (inlineBtn) inlineBtn.style.display = 'inline-block';
        } else {
            if (openBtn) openBtn.style.display = 'none';
            if (inlineBtn) inlineBtn.style.display = 'none';
        }
    }

    function renderArchiveList(activeId) {
        const listContainer = document.getElementById('archive-list');
        listContainer.innerHTML = '';

        hutbelerData.forEach(hutbe => {
            const item = document.createElement('div');
            item.className = `archive-item ${hutbe.id === activeId ? 'active' : ''}`;
            item.innerHTML = `
                <span class="archive-date">${hutbe.tarih}</span>
                <span class="archive-name">${hutbe.baslik}</span>
            `;
            item.onclick = () => {
                loadHutbe(hutbe.id);
                // Hutbe seçildiğinde telefonda veya ekranda otomatik kapanması için (istersen bu satırı silebilirsin, şu an tıklandığı an kapanıyor):
                if (window.innerWidth <= 850) {
                    toggleSidebar();
                }
            };
            listContainer.appendChild(item);
        });
    }

    function loadHutbe(id) {
        const hutbe = hutbelerData.find(h => h.id === id) || hutbelerData[0];
        
        document.getElementById('hutbe-date').innerText = hutbe.tarih;
        document.getElementById('hutbe-title').innerText = hutbe.baslik;
        document.getElementById('hutbe-link').href = hutbe.link;

        let contentHTML = `<div class="quote-box">${hutbe.ayet}</div>`;
        hutbe.metin.forEach(paragraf => {
            contentHTML += `<p>${paragraf}</p>`;
        });
        document.getElementById('hutbe-content').innerHTML = contentHTML;

        renderArchiveList(hutbe.id);
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleTheme() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        const newTheme = isLight ? 'dark' : 'light';
        applyTheme(newTheme);
    }

    function applyTheme(theme) {
        const btn = document.getElementById('theme-btn');
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            if (btn) btn.innerHTML = '🌙'; 
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            if (btn) btn.innerHTML = '☀️'; 
            localStorage.setItem('theme', 'dark');
        }
    }

    window.onload = () => {
        initTheme();
        loadHutbe(hutbelerData[0].id);
        // İlk açılışta mobilde direkt geniş ekranda okunsun istersen buraya toggleSidebar() ekleyebilirsin, şu an açık başlıyor.
    };
</script>
</body>
</html>
