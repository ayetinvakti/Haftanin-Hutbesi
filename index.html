    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const savedBg = localStorage.getItem('custom_bg');
        if (savedBg && savedTheme !== 'light') {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

            --border-color: #334155;

        .archive-list { display: flex; flex-direction: column; gap: 6px; max-height: 350px; overflow-y: auto; padding-right: 4px; }

        .app-title { font-size: 1.1rem; font-weight: 700; color: var(--accent-color); text-align: center; }

    </style>
</head>

            ayet: "“Allah'a ibadet edin ve O'na hiçbir şeyi ortak koşmayın. Anne babaya, akrabaya, yetimlere, yoksullara, yakın komşuya, uzak komşuya... iyilik edin.” (Nisâ, 4/36)",
            metin: [
                "Aziz Müminler!",
                "Modern hayatın getirdiği koşturmaca içerisinde bazen en yakınımızda kimin oturduğunu, halinin ne olduğunu unutur hale geldik. Oysa medeniyetimiz bir komşu medeniyetidir.",
                "'Komşusu açken tok yatan bizden değildir' ölçüsüyle hareket eden bir inancın mensupları olarak, komşuluk ilişkilerini canlı tutmak, dar günlerinde yardımına koşmak ve sevinçlerini paylaşmak toplumsal bağlarımızın çimentosudur.",
                "Yüce Allah komşularımızla olan ilişkilerimizi sevgi, saygı ve huzur temelinde daim eylesin."
            ],
            link: "https://www.diyanethaber.com.tr"
        }
    ];

    function toggleSidebar() {
        const wrapper = document.getElementById('main-wrapper');
        const sidebar = document.getElementById('sidebar-card');
        const backdrop = document.getElementById('modal-backdrop');
        
        if (window.innerWidth <= 850) {
            sidebar.classList.toggle('mobile-open');
            backdrop.classList.toggle('active');
        } else {
            wrapper.classList.toggle('sidebar-closed');
        }
    }

    function renderArchiveList(activeId) {
        const listContainer = document.getElementById('archive-list');
        listContainer.innerHTML = '';

        hutbelerData.forEach(hutbe => {
            const item = document.createElement('div');
            item.className = `archive-item ${hutbe.id === activeId ? 'active' : ''}`;
            item.innerHTML = `
                <span class="archive-date">${hutbe.tarih}</span>
                <span class="archive-name">${hutbe.baslik}</span>
            `;
            item.onclick = () => {
                loadHutbe(hutbe.id);
                if (window.innerWidth <= 850) {
                    toggleSidebar();
                }
            };
            listContainer.appendChild(item);
        });
    }

    function loadHutbe(id) {
        const hutbe = hutbelerData.find(h => h.id === id) || hutbelerData[0];
        
        document.getElementById('hutbe-date').innerText = hutbe.tarih;
        document.getElementById('hutbe-title').innerText = hutbe.baslik;
        document.getElementById('hutbe-link').href = hutbe.link;

        let contentHTML = `<div class="quote-box">${hutbe.ayet}</div>`;
        hutbe.metin.forEach(paragraf => {
            contentHTML += `<p>${paragraf}</p>`;
        });
        document.getElementById('hutbe-content').innerHTML = contentHTML;

        renderArchiveList(hutbe.id);
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleTheme() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        const newTheme = isLight ? 'dark' : 'light';
        applyTheme(newTheme);
    }

    function applyTheme(theme) {
        const btn = document.getElementById('theme-btn');
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            if (btn) btn.innerHTML = '🌙'; 
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            if (btn) btn.innerHTML = '☀️'; 
            localStorage.setItem('theme', 'dark');
        }
    }

    window.onload = () => {
        initTheme();
        loadHutbe(hutbelerData[0].id);
    };
</script>
</body>
</html>
