<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haftanın Hutbesi | Ayetin Vakti</title>
    <meta name="theme-color" content="#0f172a">

    <script>
        // Tema ve özel renk paleti (titremeyi önlemek için en başta çalışır; tema sınıfı yalnızca <html> üzerinde)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
                d.classList.add('light-mode');
            }
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }
            // Tarayıcı çubuğu rengi sayfa zeminine uysun
            const metaTC = document.querySelector('meta[name="theme-color"]');
            if (metaTC) metaTC.setAttribute('content', b || (d.classList.contains('light-mode') ? '#f1f5f9' : '#0f172a'));

            // Yön (RTL titremesini önlemek için)
            d.setAttribute('dir', (localStorage.getItem('user_lang') || 'tr') === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>

    <style>
        :root {
            color-scheme: dark;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #047857;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html.light-mode {
            color-scheme: light;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --accent-hover: #047857;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --btn-bg: #f8fafc;
            --btn-hover: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        /* Ard arda dokunuşta çift dokunma yakınlaştırmasını kapatır (iki parmakla yakınlaştırma açık kalır) */
        html, body, button, a, select, input, label, [onclick] { touch-action: manipulation; }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; transition: background-color 0.3s ease, color 0.3s ease; }

        .main-wrapper { width: 100%; max-width: 1050px; display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; transition: 0.3s ease; }

        .main-wrapper.sidebar-closed { grid-template-columns: 1fr; max-width: 750px; }
        .main-wrapper.sidebar-closed .sidebar-card { display: none; }

        @media(max-width: 850px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .main-wrapper.sidebar-closed .sidebar-card { display: none; }
            .sidebar-card {
                display: none;
                position: fixed !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                width: 90% !important;
                max-width: 400px !important;
                max-height: 80vh !important;
                z-index: 1000 !important;
                box-shadow: 0 25px 50px rgba(0,0,0,0.7) !important;
            }
            .sidebar-card.mobile-open { display: flex !important; }

            .modal-backdrop {
                display: none;
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(4px);
                z-index: 999;
            }
            .modal-backdrop.active { display: block; }
        }

        .container { width: 100%; display: flex; flex-direction: column; gap: 16px; }

        .sidebar-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); position: sticky; top: 16px; }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; background-color: var(--card-bg); z-index: 2; }
        .sidebar-title { font-size: 1rem; font-weight: 700; color: var(--accent-color); display: flex; align-items: center; gap: 6px; }

        .collapse-btn { background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        @media (hover: hover) { .collapse-btn:hover { border-color: var(--accent-color); color: var(--accent-color); background: var(--btn-hover); } }

        .archive-list { display: flex; flex-direction: column; gap: 6px; max-height: 350px; overflow-y: auto; padding-right: 4px; }

        .archive-list::-webkit-scrollbar { width: 6px; }
        .archive-list::-webkit-scrollbar-track { background: transparent; }
        .archive-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .archive-list::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        .archive-item { text-align: left; background: var(--btn-bg); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--text-color); transition: 0.2s; display: flex; flex-direction: column; gap: 2px; }
        .archive-item.active { border-color: var(--accent-color); background: var(--btn-hover); }
        @media (hover: hover) { .archive-item:hover { border-color: var(--accent-color); background: var(--btn-hover); } }
        .archive-date { font-size: 0.75rem; color: var(--accent-color); font-weight: 600; }
        .archive-name { font-size: 0.85rem; font-weight: 600; color: var(--text-color); }

        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: var(--shadow); transition: 0.3s; }
        [dir="rtl"] .navbar { flex-direction: row-reverse; }

        .circle-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; font-size: 1.2rem; transition: 0.2s; }
        @media (hover: hover) { .circle-btn:hover { border-color: var(--accent-color); color: var(--accent-color); background: var(--btn-hover); } }

        .nav-left-group { display: flex; align-items: center; gap: 8px; }
        .app-title { font-size: 1.1rem; font-weight: 700; color: var(--accent-color); text-align: center; }

        .content-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); transition: 0.3s; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .card-title { font-size: 1.15rem; font-weight: 700; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }

        .show-archive-btn { background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--accent-color); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: none; transition: 0.2s; }
        @media (hover: hover) { .show-archive-btn:hover { background: var(--btn-hover); border-color: var(--accent-color); } }

        .date-badge { font-size: 0.8rem; background: var(--btn-bg); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 20px; color: var(--text-muted); font-weight: 600; }

        .hutbe-meta { display: flex; flex-direction: column; gap: 6px; }
        .hutbe-main-title { font-size: 1.15rem; font-weight: 700; color: var(--text-color); line-height: 1.4; }

        .hutbe-body { font-size: 0.92rem; color: var(--text-muted); line-height: 1.7; display: flex; flex-direction: column; gap: 12px; }
        .hutbe-body p { text-align: justify; }

        .quote-box { background: var(--btn-bg); border-left: 4px solid var(--accent-color); padding: 12px 16px; border-radius: 0 12px 12px 0; font-style: italic; color: var(--text-color); font-size: 0.9rem; }
        [dir="rtl"] .quote-box { border-left: none; border-right: 4px solid var(--accent-color); border-radius: 12px 0 0 12px; }

        .hutbe-body p.hutbe-heading { font-weight: 700; color: var(--text-color); text-align: left; margin-top: 6px; }
        .sources { font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; border-top: 1px solid var(--border-color); padding-top: 10px; }

        .info-box { background: var(--btn-bg); border: 1px dashed var(--border-color); padding: 14px 16px; border-radius: 12px; font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; text-align: center; }

        .link-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .external-link-btn { flex: 1 1 200px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; background: var(--accent-color); color: #fff; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow); transition: 0.2s; margin-top: 6px; }
        @media (hover: hover) { .external-link-btn:hover { background: var(--accent-hover); } }
        .external-link-btn.secondary { background: var(--btn-bg); color: var(--accent-color); border: 1px solid var(--border-color); box-shadow: none; }
        @media (hover: hover) { .external-link-btn.secondary:hover { border-color: var(--accent-color); background: var(--btn-hover); } }

        .footer { grid-column: 1 / -1; margin: 10px 0; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
        .footer span { color: var(--accent-color); font-weight: 600; }
    </style>
</head>
<body>

<div class="modal-backdrop" id="modal-backdrop" onclick="toggleSidebar()"></div>

<div class="main-wrapper sidebar-closed" id="main-wrapper">
    <!-- SOL ARŞİV MENÜSÜ -->
    <div class="sidebar-card" id="sidebar-card">
        <div class="sidebar-header">
            <div class="sidebar-title">📚 Hutbe Arşivi</div>
            <button class="collapse-btn" onclick="toggleSidebar()" title="Menüyü Gizle">✕</button>
        </div>
        <div class="archive-list" id="archive-list"></div>
    </div>

    <!-- SAĞ ANA İÇERİK ALANI -->
    <div class="container">
        <header class="navbar">
            <div class="nav-left-group">
                <a href="../" class="circle-btn" title="Ana Sayfaya Dön">←</a>
                <button class="circle-btn" onclick="toggleSidebar()" id="menu-open-btn" title="Arşivi Aç">📚</button>
            </div>
            <div class="app-title">Haftanın Hutbesi</div>
            <button class="circle-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">🌙</button>
        </header>

        <div class="content-card">
            <div class="card-header-flex">
                <div class="card-title">
                    📜 Cuma Hutbesi
                    <button class="show-archive-btn" id="show-archive-inline" onclick="toggleSidebar()" style="display:inline-block;">📚 Arşivi Göster</button>
                </div>
                <div class="date-badge" id="hutbe-date">Yükleniyor...</div>
            </div>

            <div class="hutbe-meta">
                <div class="hutbe-main-title" id="hutbe-title">Yükleniyor...</div>
            </div>

            <div class="hutbe-body" id="hutbe-content"></div>

            <div class="link-row">
                <a href="#" target="_blank" rel="noopener" id="hutbe-audio" class="external-link-btn secondary" style="display:none;">🎧 Sesli Hutbeyi Dinle</a>
                <a href="https://turkiye.gov.tr/diyanet-isleri-cuma-ve-bayram-hutbeleri" target="_blank" rel="noopener" id="hutbe-link" class="external-link-btn">
                    🔗 Diyanet Orijinal Kaynak (PDF / Word)
                </a>
            </div>
        </div>
    </div>
</div>

<div class="footer">© Ayetin Vakti • <span>Huzur ve İbadet Rehberliğiniz</span></div>

<script>
    // Hutbeler hutbeler.json dosyasından gelir; dosya GitHub Actions ile her hafta otomatik güncellenir.
    let hutbelerData = [];
    let aktifId = null;

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtTarih(id) {
        const [y, m, d] = id.split('-').map(Number);
        return new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(y, m - 1, d));
    }

    function toggleSidebar() {
        const wrapper = document.getElementById('main-wrapper');
        const sidebar = document.getElementById('sidebar-card');
        const backdrop = document.getElementById('modal-backdrop');

        if (window.innerWidth <= 850) {
            sidebar.classList.toggle('mobile-open');
            backdrop.classList.toggle('active');
        } else {
            wrapper.classList.toggle('sidebar-closed');
        }
    }

    function renderArchiveList(activeId) {
        const listContainer = document.getElementById('archive-list');
        listContainer.innerHTML = '';

        hutbelerData.forEach(hutbe => {
            const item = document.createElement('div');
            item.className = `archive-item ${hutbe.id === activeId ? 'active' : ''}`;
            item.innerHTML = `
                <span class="archive-date">${esc(fmtTarih(hutbe.id))}</span>
                <span class="archive-name">${esc(hutbe.baslik)}</span>
            `;
            item.onclick = () => {
                loadHutbe(hutbe.id);
                if (window.innerWidth <= 850) toggleSidebar();
            };
            listContainer.appendChild(item);
        });
    }

    function loadHutbe(id) {
        const hutbe = hutbelerData.find(h => h.id === id) || hutbelerData[0];
        if (!hutbe) return;
        aktifId = hutbe.id;

        document.getElementById('hutbe-date').innerText = fmtTarih(hutbe.id);
        document.getElementById('hutbe-title').innerText = hutbe.baslik;

        const audio = document.getElementById('hutbe-audio');
        if (hutbe.ses) { audio.href = hutbe.ses; audio.style.display = 'flex'; }
        else { audio.style.display = 'none'; }

        let html = '';
        if (hutbe.ayet) html += `<div class="quote-box">${esc(hutbe.ayet)}</div>`;
        if (hutbe.metin && hutbe.metin.length) {
            hutbe.metin.forEach(p => {
                const baslikMi = p.length <= 50 && p.endsWith('!');
                html += baslikMi ? `<p class="hutbe-heading">${esc(p)}</p>` : `<p>${esc(p)}</p>`;
            });
            if (hutbe.arapca) {
                html += `<div class="info-box">Hutbedeki Arapça ayet ve hadis metinleri için Diyanet'in orijinal PDF'sine bakabilirsiniz.</div>`;
            }
            if (hutbe.kaynaklar && hutbe.kaynaklar.length) {
                html += `<div class="sources">Kaynaklar: ${esc(hutbe.kaynaklar.join(' • '))}</div>`;
            }
        } else {
            html += `<div class="info-box">Bu hutbenin metni henüz eklenmedi. Aşağıdaki bağlantıdan Diyanet'in orijinal metnine ulaşabilir veya sesli olarak dinleyebilirsiniz.</div>`;
        }
        document.getElementById('hutbe-content').innerHTML = html;

        renderArchiveList(hutbe.id);
        history.replaceState(null, '', '#' + hutbe.id);
    }

    async function loadData() {
        try {
            const res = await fetch('hutbeler.json?ts=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            hutbelerData = (json.hutbeler || []).slice().sort((a, b) => b.id.localeCompare(a.id));
            if (!hutbelerData.length) throw new Error('Liste boş');
            const hashId = location.hash.replace('#', '');
            loadHutbe(hashId || hutbelerData[0].id);
        } catch (e) {
            document.getElementById('hutbe-date').innerText = '—';
            document.getElementById('hutbe-title').innerText = 'Hutbe yüklenemedi';
            document.getElementById('hutbe-content').innerHTML =
                `<div class="info-box">Hutbe listesi şu an yüklenemedi. Lütfen daha sonra tekrar deneyin veya Diyanet'in orijinal kaynağını kullanın.</div>`;
        }
    }

    // --- TEMA YÖNETİMİ (standart: tema sınıfı yalnızca <html> üzerinde) ---
    function syncThemeBtn() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.innerHTML = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    // Tarayıcı çubuğu rengini (theme-color) o anki arka plan rengine eşitler
    function updateThemeColor() {
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        const m = document.querySelector('meta[name="theme-color"]');
        if (m && bg) m.setAttribute('content', bg);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        syncThemeBtn();
        updateThemeColor();
    }

    window.onload = () => {
        syncThemeBtn();
        updateThemeColor();
        loadData();
    };
</script>
</body>
</html>
