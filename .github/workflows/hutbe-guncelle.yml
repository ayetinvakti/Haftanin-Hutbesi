name: Hutbe Güncelle

on:
  schedule:
    - cron: '30 19 * * 4'   # Perşembe 22:30 (TR)
    - cron: '0 5 * * 5'     # Cuma 08:00 (TR)
    - cron: '0 9 * * 5'     # Cuma 12:00 (TR)
  workflow_dispatch:         # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pdftotext kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Hutbeleri güncelle
        run: node hutbe-guncelle.js
        env:
          DATA_PATH: hutbeler.json

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hutbeler.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Hutbe listesi güncellendi"
            git push
          fi
